x="12" y="12" width="58" height="80" rx="8" fill="#D8DCE2"/><rect x="82" y="24" width="114" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="39" width="88" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="54" width="100" height="6" rx="3" fill="#D8DCE2"/></g><g transform="translate(18 118)"><rect width="224" height="104" rx="12" fill="#EAECF0"/><rect x="12" y="12" width="58" height="80" rx="8" fill="#D8DCE2"/><rect x="82" y="24" width="114" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="39" width="88" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="54" width="100" height="6" rx="3" fill="#D8DCE2"/></g><g transform="translate(18 236)"><rect width="224" height="104" rx="12" fill="#EAECF0"/><rect x="12" y="12" width="58" height="80" rx="8" fill="#D8DCE2"/><rect x="82" y="24" width="114" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="39" width="88" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="54" width="100" height="6" rx="3" fill="#D8DCE2"/></g><g transform="translate(18 354)"><rect width="224" height="66" rx="12" fill="#EAECF0"/><rect x="12" y="12" width="58" height="42" rx="8" fill="#D8DCE2"/><rect x="82" y="24" width="114" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="39" width="88" height="6" rx="3" fill="#D8DCE2"/><rect x="82" y="54" width="100" height="6" rx="3" fill="#D8DCE2"/></g><g transform="translate(18 434)"><g class="demo-native-card">
