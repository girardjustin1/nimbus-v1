name: CI

# Validates every pull request (and every push to a branch) before it can ship:
# type-check, lint, unit + Storybook tests, and both builds that the Pages deploy runs.
on:
    pull_request:
    push:
        branches-ignore: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Runner pinned rather than ubuntu-latest: that label moves to Ubuntu 26 on
# 19 Oct 2026, and a runner image changing under us is a thing to do
# deliberately, on a branch, not on whichever push lands that morning.
jobs:
    validate:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Storybook tests render every story in headless Chromium.
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Type-check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Tests (unit + Storybook)
              run: npm run test

            - name: Build Storybook
              run: npm run build-storybook

            - name: Build standalone prototypes
              run: npm run proto:build
