name: Deploy Storybook to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# One deploy at a time; newer pushes cancel in-progress runs.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5
              with:
                  # Auto-enable Pages (source = GitHub Actions) if it isn't already.
                  enablement: true

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # PRO icons install from Untitled UI's private registry; .npmrc reads
            # the token from this env var (set as a repo secret).
            - name: Install dependencies
              run: npm ci
              env:
                  UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}

            - name: Build Storybook
              run: npm run build-storybook
              env:
                  UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}

            # Prototype app (Vite, src/main.tsx) served beside Storybook at
            # /<repo>/prototype/. BASE_URL feeds the router basename.
            - name: Build prototype app
              run: npx vite build --base=/${{ github.event.repository.name }}/prototype/ --outDir storybook-static/prototype
              env:
                  UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: storybook-static

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
