name: Deploy Storybook to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# One deploy at a time; newer pushes cancel in-progress runs.
concurrency:
    group: pages
    cancel-in-progress: true

# Runner pinned rather than ubuntu-latest: that label moves to Ubuntu 26 on
# 19 Oct 2026, and a runner image changing under us is a thing to do
# deliberately, on a branch, not on whichever push lands that morning.
jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v6
              with:
                  # Auto-enable Pages (source = GitHub Actions) if it isn't already.
                  enablement: true

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # PRO icons are not installed for now, so the secret may be unset. If
            # @untitledui-pro/icons is added back, .npmrc reads the token from
            # this env var (set UNTITLEDUI_PRO_TOKEN as a repo secret).
            - name: Install dependencies
              run: npm ci
              env:
                  UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}

            - name: Build Storybook
              run: npm run build-storybook
              env:
                  UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}

            # Standalone prototypes (prototypes/<name>/<version>/) served beside
            # Storybook at /<repo>/<name>/ — e.g. /nimbus-v1/das/v1/.
            - name: Build standalone prototypes
              run: npm run proto:build && cp -R dist-prototypes/. storybook-static/
              env:
                  UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: storybook-static

    deploy:
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
